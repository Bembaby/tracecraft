<script type="module">/**
 * TraceCraft Mini-Python. A deliberately small, bounded learning interpreter.
 * This is NOT CPython and is NOT a general-purpose Python judge.
 * No eval(), Function(), imports, file access, network access, or user JS.
 */
const LIMITS = Object.freeze({ source: 12000, lines: 160, steps: 500, ops: 50000, collection: 200 });
const clone = x => JSON.parse(JSON.stringify(x));
const truthy = x => Array.isArray(x) ? x.length > 0 : Boolean(x);
const format = x => Array.isArray(x) ? `[${x.map(format).join(', ')}]` : typeof x === 'boolean' ? (x ? 'True' : 'False') : String(x);

function runMiniPython(source, overrides = {}) {
  if (typeof source !== 'string' || source.length > LIMITS.source) throw new Error('Keep your program below 12,000 characters.');
  const raw = source.replace(/\r/g, '').split('\n');
  if (raw.length > LIMITS.lines) throw new Error('Keep your program below 160 lines.');
  const lines = raw.map((text, i) => {
    if (/\t/.test(text)) throw new Error(`Line ${i + 1}: use spaces, not tabs.`);
    const clean = text.split('#')[0].trimEnd();
    return { text: clean.trim(), indent: clean.length - clean.trimStart().length, line: i + 1 };
  }).filter(x => x.text);
  let pos = 0;
  function block(indent = 0) {
    const nodes = [];
    while (pos < lines.length) {
      const l = lines[pos];
      if (l.indent < indent || (l.indent === indent && l.text === 'else:')) break;
      if (l.indent !== indent) throw new Error(`Line ${l.line}: expected ${indent} spaces of indentation.`);
      pos++;
      let m;
      if ((m = l.text.match(/^for ([a-zA-Z]\w*) in (.+):$/))) {
        if (!lines[pos] || lines[pos].indent !== indent + 4) throw new Error(`Line ${l.line}: indent your loop body by four spaces.`);
        nodes.push({ kind: 'for', name: m[1], expr: m[2], body: block(indent + 4), line: l.line });
      } else if ((m = l.text.match(/^if (.+):$/))) {
        if (!lines[pos] || lines[pos].indent !== indent + 4) throw new Error(`Line ${l.line}: indent the if body by four spaces.`);
        const body = block(indent + 4); let alternative = [];
        if (lines[pos]?.indent === indent && lines[pos]?.text === 'else:') {
          pos++;
          if (!lines[pos] || lines[pos].indent !== indent + 4) throw new Error('Indent the else body by four spaces.');
          alternative = block(indent + 4);
        }
        nodes.push({ kind: 'if', expr: m[1], body, alternative, line: l.line });
      } else if ((m = l.text.match(/^print\((.+)\)$/))) {
        nodes.push({ kind: 'print', expr: m[1], line: l.line });
      } else if ((m = l.text.match(/^([a-zA-Z]\w*)\s*(\+=|-=|\*=|=)\s*(.+)$/))) {
        if (['True','False','for','if','else','print','range','len','sum','min','max'].includes(m[1])) throw new Error(`Line ${l.line}: ${m[1]} is reserved.`);
        nodes.push({ kind: 'assign', name: m[1], op: m[2], expr: m[3], line: l.line });
      } else throw new Error(`Line ${l.line}: Mini-Python supports numeric assignments, lists, for, if/else and print. Full Python needs the optional runtime.`);
    }
    return nodes;
  }
  const ast = block();
  if (pos !== lines.length) throw new Error(`Line ${lines[pos].line}: unexpected indentation or else.`);
  const env = Object.create(null), output = [], frames = [], injected = new Set();
  let operations = 0;
  const tick = () => { if (++operations > LIMITS.ops) throw new Error('Operation limit reached. Reduce the size of your input.'); };
  const number = x => { if (typeof x !== 'number' && typeof x !== 'boolean') throw new Error('This operation needs a number.'); return Number(x); };
  const bounded = x => { if (!Number.isFinite(x) || Math.abs(x) > 1e12) throw new Error('Number outside the learning runtime limits (±1e12).'); return x; };
  function expression(text) {
    let at = 0, i = 0; const tokens = [];
    const rx = /\s*(\d+(?:\.\d+)?|[a-zA-Z]\w*|==|!=|<=|>=|\/\/|[+\-*\/%<>()\[\],])/y;
    while (at < text.length) {
      if (!text.slice(at).trim()) break;
      rx.lastIndex = at; const m = rx.exec(text);
      if (!m) throw new Error(`Unsupported expression near: ${text.slice(at, at + 24)}`);
      tokens.push(m[1]); at = rx.lastIndex;
    }
    const take = t => { if (tokens[i] !== t) throw new Error(`Expected '${t}', got '${tokens[i] ?? 'end of expression'}'.`); i++; };

        if (index < 0) index += value.length;
        if (index < 0 || index >= value.length) throw new Error('List index out of range.');
        value = value[index];
      }
      return value;
    }

      let left = atom(); let compared = false;

        if (p === 1 && compared) throw new Error('Use one comparison at a time in Mini-Python.');
        const right = expr(p + 1); tick();

          compared = true;
          const equal = (a,b) => Array.isArray(a) && Array.isArray(b) ? a.length === b.length && a.every((v,j)=>equal(v,b[j])) : (typeof a === 'number' || typeof a === 'boolean') && (typeof b === 'number' || typeof b === 'boolean') ? Number(a) === Number(b) : a === b;
          if (op === '==') left = equal(left, right);
          else if (op === '!=') left = !equal(left, right);
          else { const a = number(left), b = number(right); left = op === '<' ? a < b : op === '>' ? a > b : op === '<=' ? a <= b : a >= b; }
        } else if (op === '+' && Array.isArray(left) && Array.isArray(right)) {
          left = [...left, ...right]; if (left.length > LIMITS.collection) throw new Error('List limit: 200 elements.');
        } else {
          const a = number(left), b = number(right);
          if (['/', '//', '%'].includes(op) && b === 0) throw new Error('Cannot divide by zero.');
          left = bounded(op === '+' ? a + b : op === '-' ? a - b : op === '*' ? a * b : op === '/' ? a / b : op === '//' ? Math.floor(a / b) : a - Math.floor(a / b) * b);
        }
      }
      return left;
    }
    if (!tokens.length) throw new Error('Expected an expression.');
    const result = expr(0); if (i !== tokens.length) throw new Error(`Unexpected token '${tokens[i]}'.`); return result;
  }
  const snapshot = (node, note) => {
    if (frames.length >= LIMITS.steps) throw new Error('Trace limit: 500 steps. Try a smaller input.');
    frames.push({ line: node.line, variables: clone(env), output: [...output], note });
  };
  function execute(nodes) {
    for (const node of nodes) {
      tick();
      try {
        if (node.kind === 'assign') {
          let value;
          if (node.op === '=' && Object.hasOwn(overrides, node.name) && !injected.has(node.name)) {
            const fixture = overrides[node.name];
            const valid = x => (typeof x === 'number' && Number.isFinite(x) && Math.abs(x) <= 1e12) || typeof x === 'boolean';
            if (!(valid(fixture) || (Array.isArray(fixture) && fixture.length <= LIMITS.collection && fixture.every(valid)))) throw new Error('Invalid test fixture: use bounded numbers or a flat list.');
            value = clone(fixture); injected.add(node.name);
          } else if (node.op === '=') value = expression(node.expr);
          else value = expression(`${node.name} ${node.op[0]} (${node.expr})`);
          env[node.name] = value;
          snapshot(node, `${node.name} now holds ${format(value)}.`);
        } else if (node.kind === 'print') {
          const value = expression(node.expr); output.push(format(value)); snapshot(node, `Send ${format(value)} to the output.`);
        } else if (node.kind === 'for') {
          const items = expression(node.expr);
          if (!Array.isArray(items)) throw new Error('for needs a list or range.');
          if (!items.length) snapshot(node, 'The list is empty, so skip the loop body.');
          for (const item of items) { env[node.name] = item; snapshot(node, `Next iteration: ${node.name} = ${format(item)}.`); execute(node.body); }
        } else {
          const condition = truthy(expression(node.expr));
          snapshot(node, `The condition is ${condition ? 'True' : 'False'}.`); execute(condition ? node.body : node.alternative);
        }
      } catch (error) { if (!/^Line \d+:/.test(error.message)) error.message = `Line ${node.line}: ${error.message}`; throw error; }
    }
  }
  execute(ast); return { frames, output, variables: clone(env), operations };
}

function assess(source, challenge) {
  return challenge.tests.map(test => {
    try {
      const result = runMiniPython(source, test.input);
      const actual = result.output.at(-1) ?? '';
      return { name: test.name, passed: actual === test.expected, expected: test.expected, actual };
    } catch (error) { return { name: test.name, passed: false, expected: test.expected, actual: error.message }; }
  });
}

function retrieve(query, k = 3) {
  const stop = new Set(['the','a','an','what','why','how','do','does','is','are','to','and','of','in','for']);
  const words = [...new Set(query.toLowerCase().match(/[a-z]+/g) ?? [])].filter(x => !stop.has(x));
  return corpus.map(d => { const tokens = new Set((d.title+' '+d.text).toLowerCase().match(/[a-z]+/g)); return {...d,score:words.filter(w=>tokens.has(w)).length}; }).filter(d=>d.score>0).sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id)).slice(0,k);
}

function systems(){return `<div class="section-intro"><div class="eyebrow">SYSTEMS YOU CAN REASON ABOUT</div><h1>Follow the data.</h1><p>Change an assumption. Observe its effect. Name the limitations of the model.</p></div><div class="tabs"><button data-action="system-rag" class="${systemMode==='rag'?'selected':''}">RAG & evidence</button><button data-action="system-cache" class="${systemMode==='cache'?'selected':''}">Cache & capacity</button><button data-action="system-db" class="${systemMode==='db'?'selected':''}">Database filtering</button></div><div id="system-content">${systemBody()}</div>`;}
function systemBody(){
 if(systemMode==='rag'){const evidence=retrieve(ragQuery);return `<div class="notice">An honest retrieval demo: keyword overlap across ${corpus.length} original passages. No embeddings, LLM, vector database, or generated answer is connected.</div><div class="pipeline" aria-label="Retrieval pipeline">${ragStages.map((s,i)=>`<button data-action="rag-stage" data-index="${i}" class="${ragIndex===i?'active':''}"><span>0${i+1}</span>${s.name}</button>`).join('')}</div><section class="panel system-detail"><div class="eyebrow">STEP 0${ragIndex+1}</div><h2>${ragStages[ragIndex].name}</h2><p>${ragStages[ragIndex].detail}</p><form id="rag-form" class="system-search"><label class="sr-only" for="rag-query">Search the original lesson passages</label><input id="rag-query" value="${esc(ragQuery)}" maxlength="200" placeholder="Try: database cache"><button class="primary" type="submit">Retrieve evidence ${icon('search')}</button></form><div id="evidence-results">${evidence.length?evidence.map(d=>`<article class="evidence"><div class="row between"><h3>[${d.id}] ${d.title}</h3><span class="chip">${d.score} keyword match${d.score===1?'':'es'}</span></div><p>${d.text}</p><small>Original TraceCraft concept note · not an external quotation</small></article>`).join(''):'<div class="empty-state"><h3>No supporting passage found.</h3><p>Abstain instead of inventing an answer. Try a more specific query.</p></div>'}</div></section>`;}
 if(systemMode==='cache')return `<div class="notice">A toy steady-state capacity model, not a load test. Assumes equal requests, uniform load, a fixed hit rate, and independent servers. It does not predict real latency or failures.</div><div class="studio-grid"><section class="panel"><div class="eyebrow">CHANGE THE ASSUMPTIONS</div><h2>What reaches your servers?</h2>${[['rps','Incoming requests / second',10,1000,10],['hit','Cache hit rate (%)',0,100,1],['capacity','Requests / second per server',10,200,10],['servers','Server count',1,12,1]].map(([key,label,min,max,step])=>`<label class="slider-label" for="cache-${key}"><span>${label}</span><strong id="value-${key}">${cache[key]}</strong></label><input class="simulation-range" id="cache-${key}" data-cache="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${cache[key]}">`).join('')}</section><section class="panel" id="cache-metrics">${cacheMetrics()}</section></div>`;
 const rows=[{id:1,item:'Notebook',price:12},{id:2,item:'Keyboard',price:65},{id:3,item:'Cable',price:9},{id:4,item:'Stand',price:28},{id:5,item:'Monitor',price:180}],filtered=rows.filter(r=>r.price>=dbMin);
 return `<div class="notice">A relational filtering concept demo over five local rows. JavaScript applies the predicate; this is not a SQL parser or database connection.</div><section class="panel"><div class="eyebrow">INPUT → PREDICATE → OUTPUT</div><h2>Keep only the matching rows.</h2><label for="db-min">Minimum price</label><input id="db-min" type="number" min="0" max="1000" value="${dbMin}" style="margin-left:12px;width:110px"><div class="output-panel" style="margin:20px 0"><pre>SELECT id, item, price\nFROM products\nWHERE price &gt;= ${dbMin};</pre></div><div class="studio-grid"><div><h3>All rows (${rows.length})</h3>${rows.map(r=>`<div class="test-row"><strong>${r.id} · ${r.item}</strong><span>${r.price}</span></div>`).join('')}</div><div><h3>Matching rows (${filtered.length})</h3>${filtered.length?filtered.map(r=>`<div class="test-row pass"><strong>${r.id} · ${r.item}</strong><span>${r.price}</span></div>`).join(''):'<p>No rows satisfy the predicate.</p>'}</div></div><p class="small-note" style="margin-top:20px">Next lesson: NULL, joins, and why a suitable index changes the access path—not the required result.</p></section>`;
}
function cacheMetrics(){const origin=cache.rps*(1-cache.hit/100),total=cache.capacity*cache.servers,util=origin/total*100,minimum=Math.ceil(origin/cache.capacity);return `<div class="eyebrow">CALCULATED, NOT MEASURED</div><h2>The bottleneck becomes visible.</h2><div class="metrics-grid"><div class="metric"><strong>${origin.toFixed(1)}</strong><small>origin requests / sec</small></div><div class="metric"><strong>${util.toFixed(0)}%</strong><small>nominal utilization</small></div><div class="metric"><strong>${minimum}</strong><small>minimum servers*</small></div></div><div class="notice ${util>100?'danger':''}">${util>100?'Demand exceeds nominal capacity. The toy model is overloaded.':'Demand fits the nominal capacity. This does not guarantee a production latency target.'}</div><p>Origin demand = incoming rate × (1 − cache hit rate). Nominal capacity = server count × capacity per server.</p><p class="small-note">*Arithmetic minimum at 100% utilization, with no safety margin or redundancy. Even at a modeled 100% hit rate, a real cache still needs a backing system for misses, writes, and recovery.</p>`;}
function readingRoom(){return `<div class="section-intro"><div class="eyebrow">THE READING ROOM</div><h1>Go deeper. Keep the source.</h1><p>Original explanations are the starting point. Read the primary material, verify a claim, and build a small experiment.</p></div><div class="notice">A linked reading catalog—not copied textbooks. Access, edition, licensing, and commercial reuse rights differ. Paid books and courses are not included.</div><div class="reading-grid">${readings.map((r,i)=>`<article class="panel book-card"><div class="book-mark">${String(i+1).padStart(2,'0')}</div><span class="eyebrow">${r.topic}</span><h2>${r.title}</h2><small>${r.author}</small><p>${r.note}</p><a class="text-btn" href="${r.url}" target="_blank" rel="noopener noreferrer">Open original source ${icon('external')}</a></article>`).join('')}</div>`;}
function studio(){const p=interviewPrompts[promptIndex];const supported=Boolean(globalThis.SpeechRecognition||globalThis.webkitSpeechRecognition);return `<div class="section-intro"><div class="eyebrow">THE INTERVIEW STUDIO</div><h1>Understanding, out loud.</h1><p>A good explanation is part of the solution. Practice without pretending a checklist is an AI interview score.</p></div><div class="lab-toolbar"><label for="prompt-select">Choose a prompt</label><select id="prompt-select">${interviewPrompts.map((x,i)=>`<option value="${i}" ${i===promptIndex?'selected':''}>${x.title}</option>`).join('')}</select><span class="chip">Self-practice · no AI connected</span></div><div class="studio-grid"><section class="panel"><div class="row between"><span class="eyebrow">${p.tag}</span><button class="text-btn" data-action="speak">${icon('volume')} Read prompt</button></div><h2 style="margin-top:20px">${p.title}</h2><p class="prompt-text">${p.prompt}</p><div class="mic-visual" id="mic-visual">${Array.from({length:22},(_,i)=>`<span style="height:${10+(Math.sin(i*1.4)+1)*21}px"></span>`).join('')}</div><div class="row"><button class="primary" data-action="mic" ${!supported?'disabled':''}>${icon('mic')} <span id="mic-label">Start dictation</span></button><span class="studio-status" id="studio-status">${supported?'Microphone starts only when you choose.':'Speech recognition is not supported here. Type below.'}</span></div><div class="notice" style="margin-top:20px">Optional browser speech recognition may send audio to your browser’s speech service. The app does not store audio. Review the consent notice before starting. Text-to-speech voice availability also depends on your device.</div><label for="transcript" class="eyebrow">YOUR EXPLANATION · TYPING ALWAYS WORKS</label><textarea id="transcript" class="transcript" maxlength="15000" placeholder="Start with the input and constraints. Then explain the state, the edge case, and the trade-off…">${esc(state.transcripts[promptIndex]||'')}</textarea><div class="row between"><button class="ghost" data-action="save-transcript">Save explanation locally</button><small id="word-count">${(state.transcripts[promptIndex]||'').trim().split(/\s+/).filter(Boolean).length} words</small></div></section><section class="panel"><div class="eyebrow">REFLECT, DON’T CHASE A SCORE</div><h2 style="margin-top:12px">Did you make it clear?</h2><p>This rubric is a self-assessment. It does not evaluate correctness or predict interview performance.</p>${p.rubric.map((r,i)=>`<label class="rubric-item"><input type="checkbox" class="rubric-check"><span>${r}</span></label>`).join('')}<p id="rubric-status" class="small-note">0 of ${p.rubric.length} reflection items checked.</p><hr class="divider"><h3>One better attempt.</h3><p>Spot one gap in your explanation. Return to the code or source. Then explain it again without reading a script.</p><a class="ghost" href="#lab">Back to the practice lab ${icon('arrow')}</a><hr class="divider"><span class="chip">Provider-backed voice tutor: planned</span></section></div>`;}
function settings(){return `<div class="section-intro"><div class="eyebrow">MAKE THIS SPACE YOURS</div><h1>Settings & connections.</h1><p>Your learning data stays in this browser unless you explicitly export it or enable a service.</p></div><div class="settings-grid"><section class="panel"><h2>Your workspace</h2><form id="profile-form"><label class="field" for="display-name">Display name<input id="display-name" value="${esc(state.name)}" maxlength="40" required></label><label class="checkbox-setting"><input type="checkbox" id="reduce-motion" ${!state.motion?'checked':''}> Reduce decorative motion</label><button class="primary" type="submit">Save preferences</button></form><hr class="divider"><h3>Your progress, your file.</h3><p>${state.completed.length} starter exercises practiced. ${Object.keys(state.transcripts).length} saved explanations. Stored locally, not synchronized across devices.</p><button class="ghost" data-action="export">Export progress JSON</button><button class="text-btn danger" style="margin:20px 0 0" data-action="clear-data">Reset local progress</button></section><section class="panel"><h2>Voice & AI providers</h2><p>This alpha uses optional browser speech only. It does not collect API keys or connect any paid provider.</p>${[['Browser voice','Optional · device dependent'],['OpenAI Realtime API','Planned · separate API billing'],['Anthropic / compatible text APIs','Planned · voice needs an audio layer'],['Gemini Live / official entitlements','Planned · verify account and product terms'],['Local / self-hosted models','Planned · device and runtime dependent']].map(([a,b])=>`<div class="provider-row"><strong>${a}</strong><small>${b}</small></div>`).join('')}<div class="notice">A consumer AI subscription is not a universal API credential. Only documented APIs and approved provider authorization flows belong here. Never paste session cookies or account passwords into a third-party tutor.</div></section></div>`;}
function renderRoute(){pauseTrace();stopVisuals();stopSpeech();readHash();trace=null;testResults=null;labError='';frameIndex=0;hintShown=false;document.body.classList.toggle('reduce-motion',!state.motion);const views={today:dashboard,path:pathway,lab,systems,reading:readingRoom,studio,settings};$('#app').innerHTML=shell(views[route]());document.title=`${links.find(x=>x[0]===route)[1]} · TraceCraft`;updateTimer();window.scrollTo({top:0});}
function rerenderLab(){const pos=window.scrollY;$('#main').innerHTML=(state.session.started?'<div class="session-bar"><span>Focus session · <strong id="session-timer"></strong> remaining</span><button class="text-btn" data-action="session">Pause</button></div>':'')+lab()+`<footer class="footer-note"><span>TraceCraft α · Public fixture tests, original lessons, local progress.</span></footer>`;window.scrollTo({top:pos});updateTimer();const stat=$('.top-stat');if(stat)stat.innerHTML=icon('spark')+' '+state.completed.length*50+' practice XP';}
function updateTrace(){const el=$('#trace-region');if(el)el.innerHTML=labError?`<div class="notice danger" role="alert">${esc(labError)}</div>`:traceView();}
function invalidateTrace(){pauseTrace();trace=null;testResults=null;labError='';frameIndex=0;updateTrace();const tests=$('#test-region');if(tests){tests.querySelectorAll('.test-row').forEach(x=>x.remove());const head=tests.querySelector('.panel-head');if(head)head.remove();}}
function runCode(){pauseTrace();try{trace=runMiniPython(draft());frameIndex=0;labError='';if(!trace.frames.length)toast('Add an assignment or print statement to see a trace.');}catch(error){trace=null;labError=error.message;}updateTrace();}
function checkCode(){testResults=assess(draft(),currentChallenge());if(testResults.every(t=>t.passed)){const first=!state.completed.includes(selected);if(first)state.completed.push(selected);markDay();toast(first?'All public tests pass. +50 practice XP. Now explain why it works.':'All public tests still pass. Try a new input and explain your reasoning.');}else toast('A test found a counterexample. Compare expected and actual output.');rerenderLab();}
function updateTimer(){const timer=$('#session-timer');let seconds=state.session.remaining;if(state.session.started)seconds=Math.max(0,seconds-(Date.now()-state.session.started)/1000);if(timer)timer.textContent=`${Math.floor(seconds/60)}:${String(Math.floor(seconds%60)).padStart(2,'0')}`;if(state.session.started&&seconds===0){state.session.started=null;state.session.remaining=1800;save();toast('Your focus session is complete. Reflect on one thing you can now explain.');renderRoute();}}
setInterval(updateTimer,1000);
window.addEventListener('pagehide',()=>{if(state.session.started){state.session.remaining=Math.max(0,state.session.remaining-(Date.now()-state.session.started)/1000);state.session.started=null;save();}stopSpeech();stopVisuals();pauseTrace();});
function toggleSession(){if(state.session.started){state.session.remaining=Math.max(0,state.session.remaining-(Date.now()-state.session.started)/1000);state.session.started=null;}else{if(state.session.remaining<=0)state.session.remaining=1800;state.session.started=Date.now();}save();renderRoute();}
function startMic(){
 const Recognition=globalThis.SpeechRecognition||globalThis.webkitSpeechRecognition;
 if(!Recognition){toast('Speech recognition unavailable. Use the text editor.');return;}
 stopSpeech();recognition=new Recognition();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=false;
 const existing=$('#transcript').value;
 recognition.onresult=e=>{const words=Array.from(e.results).filter(r=>r.isFinal).map(r=>r[0].transcript).join(' ');if($('#transcript')){$('#transcript').value=(existing+' '+words).trim().slice(0,15000);$('#transcript').dispatchEvent(new Event('input',{bubbles:true}));}};
 const end=()=>{recording=false;$('#mic-visual')?.classList.remove('recording');if($('#mic-label'))$('#mic-label').textContent='Start dictation';if($('#studio-status'))$('#studio-status').textContent='Dictation stopped. Review the text before saving.';};
 recognition.onend=end;recognition.onerror=e=>{end();toast(`Dictation unavailable (${e.error}). Your typed explanation still works.`);};
 try{recognition.start();recording=true;$('#mic-visual')?.classList.add('recording');$('#mic-label').textContent='Stop dictation';$('#studio-status').textContent='Listening through your browser. Nothing is saved automatically.';}catch{end();toast('Could not start dictation. Check browser permissions or type your explanation.');}
}
function searchModal(){modal(`<div class="eyebrow">JUMP TO A CONCEPT</div><h2>What do you want to understand?</h2><label class="sr-only" for="global-search">Search exercises and curriculum topics</label><input class="search-field" id="global-search" placeholder="Try loops, Python, database, Java…" maxlength="100"><div id="search-results"></div>`);$('#global-search').focus();renderSearch('');}
function renderSearch(q){const query=q.toLowerCase();const items=[...challenges.map(c=>({title:c.title,detail:c.topic,hash:'#lab/'+c.id})),...stages.map(s=>({title:s.title,detail:s.status+' · '+s.topics.join(', '),hash:'#path',stage:s.id}))].filter(x=>(x.title+' '+x.detail).toLowerCase().includes(query)).slice(0,8);$('#search-results').innerHTML=items.length?items.map(x=>`<a class="search-result" href="${x.hash}" data-search-result="true" ${x.stage?`data-stage="${x.stage}"`:''}><strong>${x.title}</strong><small>${x.detail}</small>${icon('arrow')}</a>`).join(''):'<p>No matching concept. Try a broader term.</p>';}
function showStage(id){const s=stages.find(x=>x.id===id);if(!s)return;modal(`<div class="eyebrow">STAGE ${s.label} · ${s.status}</div><h2>${s.title}</h2><p>${s.outcome}</p><h3>Concepts in this stage</h3><div class="topics">${s.topics.map(x=>`<span>${x}</span>`).join('')}</div><h3 style="margin-top:25px">Build evidence</h3><p>${s.project}</p><div class="notice">${s.status==='Planned'?'This stage is planned. This page defines its scope and outcome; it does not unlock a completed course.':'The alpha includes only starter or concept experiences. Many topics listed here still need full lessons, exercises, and independent assessments.'}</div>${s.challenge?`<a class="primary" data-search-result="true" href="#lab/${s.challenge}">Open starter exercise ${icon('arrow')}</a>`:s.id==='interview'?'<a class="primary" data-search-result="true" href="#studio">Open self-practice studio</a>':['db','systems','rag'].includes(s.id)?'<a class="primary" data-search-result="true" href="#systems">Open concept demos</a>':''}`);}

document.addEventListener('click',async e=>{
 const searchLink=e.target.closest('[data-search-result]');if(searchLink){$('#modal').close();if(searchLink.dataset.stage){e.preventDefault();showStage(searchLink.dataset.stage);}return;}
 const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
 if(action==='close-modal'){$('#modal').close();return;}
 if(action==='search'){searchModal();return;}
 if(action==='stage'){showStage(button.dataset.id);return;}
 if(action==='routine'){modal('<div class="eyebrow">THE DAILY LOOP</div><h2>30 minutes. One useful concept.</h2><p><strong>3 minutes:</strong> recall yesterday without notes.<br><strong>7 minutes:</strong> read and predict a new concept.<br><strong>12 minutes:</strong> code, trace, test, repair.<br><strong>5 minutes:</strong> explain your reasoning aloud.<br><strong>3 minutes:</strong> write one takeaway and choose tomorrow.</p><div class="notice">This is a practice routine, not an employment guarantee. Complete projects and apply to suitable jobs while you keep learning.</div>');return;}
 if(action==='start-learning'){if(!state.session.started){state.session.started=Date.now();save();}navigate('#lab/'+nextChallenge().id);return;}
 if(action==='session'){toggleSession();return;}
 if(action==='enable-3d'){modal('<div class="eyebrow">OPTIONAL VISUAL ENHANCEMENT</div><h2>Load Three.js and Anime.js?</h2><p>This requests JavaScript from jsDelivr. The CDN will receive standard request metadata such as your IP address. The core app and 2D diagram work without it.</p><p>WebGL is optional. Reduced-motion preferences are respected. No lesson data is sent by this app.</p><button class="primary" data-action="confirm-3d">Load the visual libraries</button>');return;}
 if(action==='confirm-3d'){$('#modal').close();try{await enableVisuals($('#hero-art'),state.motion);toast('3D loaded. Motion stays optional.');}catch(error){toast(error.message);}return;}
 if(action==='run'){runCode();return;}
 if(action==='test'){checkCode();return;}
 if(action==='next'||action==='prev'){pauseTrace();if(trace)frameIndex=Math.max(0,Math.min(trace.frames.length-1,frameIndex+(action==='next'?1:-1)));updateTrace();return;}
 if(action==='autoplay'){if(autoplay){pauseTrace();updateTrace();return;}if(!trace?.frames.length)return;if(frameIndex===trace.frames.length-1)frameIndex=0;autoplay=setInterval(()=>{frameIndex++;if(frameIndex>=trace.frames.length-1){frameIndex=trace.frames.length-1;pauseTrace();}updateTrace();},900);updateTrace();return;}
 if(action==='mode-code'||action==='mode-blocks'){editorMode=action==='mode-code'?'code':'blocks';rerenderLab();return;}
 if(action==='block-up'||action==='block-down'){const i=Number(button.dataset.index),lines=draft().split('\n'),j=i+(action==='block-up'?-1:1);if(j<0||j>=lines.length)return;[lines[i],lines[j]]=[lines[j],lines[i]];state.drafts[selected]=lines.join('\n');save();invalidateTrace();rerenderLab();return;}
 if(action==='bug'||action==='reset-code'){state.drafts[selected]=action==='bug'?currentChallenge().bug:currentChallenge().code;save();invalidateTrace();rerenderLab();toast(action==='bug'?'A deliberate bug is loaded. Predict its behavior, then find a failing test.':'Working example restored.');return;}
 if(action==='hint'){hintShown=true;rerenderLab();return;}
 if(action==='lesson'){const c=currentChallenge();modal(`<div class="eyebrow">ORIGINAL LESSON · ${c.topic}</div><h2>${c.title}</h2><div class="lesson-text">${c.lesson.map(([title,text])=>`<h3>${title}</h3><p>${text}</p>`).join('')}</div><div class="notice">${c.complexity}. These are original teaching notes, not excerpts from a textbook.</div>`);return;}
 if(action.startsWith('system-')){systemMode=action.slice(7);$('#main').innerHTML=systems();return;}
 if(action==='rag-stage'){ragIndex=Number(button.dataset.index);$('#system-content').innerHTML=systemBody();return;}
 if(action==='speak'){if(!('speechSynthesis' in globalThis)){toast('Text-to-speech is not available in this browser.');return;}globalThis.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(interviewPrompts[promptIndex].prompt);utterance.lang='en-US';utterance.rate=.95;utterance.onerror=()=>toast('A speech voice could not play. Read the visible prompt instead.');globalThis.speechSynthesis.speak(utterance);return;}
 if(action==='mic'){if(recording){recognition.stop();return;}modal('<div class="eyebrow">MICROPHONE & PRIVACY</div><h2>Dictate your explanation?</h2><p>Your browser may transmit microphone audio to its speech-recognition service. This app cannot guarantee on-device processing. Do not include secrets, private customer data, or sensitive information.</p><p>TraceCraft does not save audio. The resulting text is saved locally only when you press “Save explanation locally.” Permission can be revoked in your browser.</p><button class="primary" data-action="confirm-mic">I understand · start dictation</button>');return;}
 if(action==='confirm-mic'){$('#modal').close();startMic();return;}
 if(action==='save-transcript'){state.transcripts[promptIndex]=$('#transcript').value.slice(0,15000);save();markDay();toast('Explanation saved in this browser. Export progress to keep a backup.');return;}
 if(action==='export'){const exportState={...state,session:{remaining:state.session.started?Math.max(0,state.session.remaining-(Date.now()-state.session.started)/1000):state.session.remaining,started:null}};const url=URL.createObjectURL(new Blob([JSON.stringify(exportState,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`tracecraft-progress-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progress export created. It can contain personal notes; keep it private.');return;}
 if(action==='clear-data'){modal('<h2>Reset this browser’s progress?</h2><p>This removes your code drafts, saved explanations, practice history, and preferences. Export a backup first. This cannot be undone.</p><button class="ghost danger" data-action="confirm-reset">Reset local data</button>');return;}
 if(action==='confirm-reset'){$('#modal').close();state=defaults();save();renderRoute();toast('Local data reset. Your next chapter starts fresh.');}
});
document.addEventListener('input',e=>{
 if(e.target.id==='code-editor'){state.drafts[selected]=e.target.value;save();invalidateTrace();$('.line-numbers').innerHTML=e.target.value.split('\n').map((_,i)=>`<span>${i+1}</span>`).join('');}
 if(e.target.id==='scrubber'){pauseTrace();frameIndex=Number(e.target.value);updateTrace();}
 if(e.target.id==='global-search')renderSearch(e.target.value);
 if(e.target.id==='transcript')$('#word-count').textContent=`${e.target.value.trim().split(/\s+/).filter(Boolean).length} words`;
 if(e.target.dataset.cache){const key=e.target.dataset.cache;cache[key]=Number(e.target.value);$('#value-'+key).textContent=cache[key];$('#cache-metrics').innerHTML=cacheMetrics();}
});
document.addEventListener('change',e=>{
 if(e.target.id==='challenge-select'){navigate('#lab/'+e.target.value);}
 if(e.target.id==='prompt-select'){stopSpeech();promptIndex=Number(e.target.value);$('#main').innerHTML=studio();}
 if(e.target.classList.contains('rubric-check'))$('#rubric-status').textContent=`${document.querySelectorAll('.rubric-check:checked').length} of ${interviewPrompts[promptIndex].rubric.length} reflection items checked. This is self-reported.`;
 if(e.target.id==='db-min'){dbMin=Math.max(0,Math.min(1000,Number(e.target.value)||0));$('#system-content').innerHTML=systemBody();}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='rag-form'){e.preventDefault();ragQuery=$('#rag-query').value.slice(0,200);$('#system-content').innerHTML=systemBody();}
 if(e.target.id==='profile-form'){e.preventDefault();state.name=$('#display-name').value.trim().slice(0,40)||'Builder';state.motion=!$('#reduce-motion').checked;save();renderRoute();toast('Workspace preferences saved locally.');}
});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#modal').open)searchModal();}
 if(e.target.id==='code-editor'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();runCode();}
 // Tab keeps normal keyboard navigation; an editor must not trap keyboard users.
});
document.addEventListener('scroll',e=>{if(e.target.id==='code-editor'&&$('.line-numbers'))$('.line-numbers').scrollTop=e.target.scrollTop;},true);
window.addEventListener('hashchange',()=>{renderRoute();$('#main')?.focus({preventScroll:true});});
renderRoute();
</script>
</body>
</html>
